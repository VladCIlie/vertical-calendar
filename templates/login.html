{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <h2 style="margin-top: 0; text-transform: uppercase;">Login via Email</h2>
    <form method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Send Code</button>
    </form>
    <p style="text-align: center; margin-top: 20px; font-size: 0.9em;">
        New user? <a href="{{ url_for('register') }}" style="color: var(--text-main);">Register here</a>
    </p>
</div>
{% endblock %}
