{% extends 'base.html' %}

{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="text-transform: uppercase; font-weight: 800; letter-spacing: 2px; margin: 0;">Edit Event</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm">&larr; Back to Dashboard</a>
    </div>

    <div class="card">
        <form action="{{ url_for('edit_event', event_id=event.id) }}" method="POST">
            <div class="form-group">
                <label for="name">Event Name</label>
                <input type="text" name="name" value="{{ event.name }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" rows="3">{{ event.description or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" name="location" value="{{ event.location or '' }}">
            </div>
            
            <div class="responsive-flex" style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label for="start_datetime">Start Date & Time</label>
                    <input type="text" id="start_datetime" name="start_datetime" value="{{ event.start_time.strftime('%d/%m/%Y %H:%M') }}" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="end_datetime">End Date & Time (Optional)</label>
                    <input type="text" id="end_datetime" name="end_datetime" value="{% if event.end_time %}{{ event.end_time.strftime('%d/%m/%Y %H:%M') }}{% endif %}">
                </div>
            </div>

            <div class="responsive-flex" style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label for="recurrence_type">Recurrence</label>
                    <select id="rec_type" name="recurrence_type" onchange="toggleMonthlyOptions()">
                        <option value="None" {% if rec_type == 'None' %}selected{% endif %}>None</option>
                        <option value="Weekly" {% if rec_type == 'Weekly' %}selected{% endif %}>Weekly</option>
                        <option value="Monthly" {% if rec_type == 'Monthly' %}selected{% endif %}>Monthly (Same Date)</option>
                        <option value="Monthly_Day" {% if rec_type == 'Monthly_Day' %}selected{% endif %}>Monthly (Specific Weekday)</option>
                    </select>
                </div>
                
                <div class="form-group" id="monthly_options" style="flex: 1; display: {% if rec_type == 'Monthly_Day' %}flex{% else %}none{% endif %}; gap: 10px;">
                    <div style="flex: 1;">
                        <label for="monthly_index">Week</label>
                        <select name="monthly_index">
                            <option value="1" {% if monthly_index == '1' %}selected{% endif %}>1st</option>
                            <option value="2" {% if monthly_index == '2' %}selected{% endif %}>2nd</option>
                            <option value="3" {% if monthly_index == '3' %}selected{% endif %}>3rd</option>
                            <option value="4" {% if monthly_index == '4' %}selected{% endif %}>4th</option>
                            <option value="-1" {% if monthly_index == '-1' %}selected{% endif %}>Last</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label for="monthly_day">Day</label>
                        <select name="monthly_day">
                            <option value="MO" {% if monthly_day == 'MO' %}selected{% endif %}>Monday</option>
                            <option value="TU" {% if monthly_day == 'TU' %}selected{% endif %}>Tuesday</option>
                            <option value="WE" {% if monthly_day == 'WE' %}selected{% endif %}>Wednesday</option>
                            <option value="TH" {% if monthly_day == 'TH' %}selected{% endif %}>Thursday</option>
                            <option value="FR" {% if monthly_day == 'FR' %}selected{% endif %}>Friday</option>
                            <option value="SA" {% if monthly_day == 'SA' %}selected{% endif %}>Saturday</option>
                            <option value="SU" {% if monthly_day == 'SU' %}selected{% endif %}>Sunday</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="responsive-flex" style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label for="tag">Event Tag (Label)</label>
                    <input type="text" name="tag" placeholder="e.g., Worship, Youth" value="{{ event.tag if event.tag else '' }}">
                </div>
                
                <div class="form-group" style="flex: 1;">
                    <label for="visibility">Visibility Restriction</label>
                    <select name="visibility">
                        <option value="Public" {% if event and event.visibility == 'Public' %}selected{% endif %}>Public (Anyone)</option>
                        <option value="Members only" {% if event and event.visibility == 'Members only' %}selected{% endif %}>Members only</option>
                        <option value="Leaders only" {% if event and event.visibility == 'Leaders only' %}selected{% endif %}>Leaders only</option>
                        <option value="Elders only" {% if event and event.visibility == 'Elders only' %}selected{% endif %}>Elders only</option>
                        <option value="Private" {% if event and event.visibility == 'Private' %}selected{% endif %}>Private (Only Me)</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 10px;">
                <button type="submit" class="btn">Save Changes</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn" style="border-color: var(--border-color); color: var(--text-muted);">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}

{% block scripts %}
<script>
    flatpickr("#start_datetime", {
        enableTime: true,
        dateFormat: "d/m/Y H:i",
        time_24hr: true
    });
    flatpickr("#end_datetime", {
        enableTime: true,
        dateFormat: "d/m/Y H:i",
        time_24hr: true
    });

    function toggleMonthlyOptions() {
        var recType = document.getElementById('rec_type').value;
        var monthlyOptions = document.getElementById('monthly_options');
        if (recType === 'Monthly_Day') {
            monthlyOptions.style.display = 'flex';
        } else {
            monthlyOptions.style.display = 'none';
        }
    }
</script>
{% endblock %}
